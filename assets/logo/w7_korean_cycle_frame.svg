<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="t d">
  <title id="t">RE:able — W7 Korean Nameplate Frame</title>
  <desc id="d">박스를 RE:able 워드마크 크기로 축소, 상단 테두리에 '리에이블' 하단 테두리에 '다시 : 가능하게'가 명패처럼 걸침(테두리 선이 글자 뒤에서 끊김). 우상단 사이클 배지 ↻ CW.</desc>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=block');
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css');
      .ko-top { font-family: 'Pretendard Variable', sans-serif; font-weight: 700; font-size: 60px; fill: #BFC9AE; letter-spacing: 0.04em; }
      .reable { font-family: 'Inter', 'Pretendard Variable', sans-serif; font-weight: 900; font-size: 150px; letter-spacing: -6px; fill: #1B1F18; }
      .colon  { fill: #8FA66E; }
      .ko-tag { font-family: 'Pretendard Variable', sans-serif; font-weight: 500; font-size: 38px; fill: #8FA66E; letter-spacing: 0.18em; }
      .vein   { stroke: #3F5328; stroke-width: 1.1; opacity: 0.15; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- 박스: RE:able 워드마크 크기로 축소 -->
  <rect x="22" y="54" width="756" height="256" rx="10" ry="10" fill="#FFFFFF" stroke="#4D5A3A" stroke-width="4"/>

  <!-- 우상단 사이클 배지 ↻ -->
  <g transform="translate(778, 54)">
    <circle r="22" fill="#4D5A3A"/>
    <path d="M 3.746 -9.272 A 10 10 0 1 1 -3.746 -9.272" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <polygon points="-0.037 -10.770 -2.547 -6.305 -4.945 -12.239" fill="#FFFFFF"/>
  </g>

  <!-- 명패 효과: 테두리 선을 글자 뒤에서 끊는 흰 배경 -->
  <rect x="270" y="24" width="260" height="60" fill="#FFFFFF"/>
  <rect x="232" y="288" width="336" height="44" fill="#FFFFFF"/>

  <!-- 상단 명패: 리에이블 (테두리 상단에 걸침) -->
  <text x="400" y="76" text-anchor="middle" class="ko-top">리에이블</text>

  <!-- 중앙: RE:able 워드마크 + 잎맥 -->
  <g transform="translate(0,-15)">
    <text x="400" y="250" text-anchor="middle" class="reable">RE<tspan class="colon">:</tspan>able</text>
    <g class="vein">
      <line x1="343.96" y1="174.87" x2="343.96" y2="198.07"/>
      <line x1="343.96" y1="189.12" x2="335.49" y2="182.06"/>
      <line x1="343.96" y1="189.12" x2="352.43" y2="182.06"/>
      <line x1="343.96" y1="225.01" x2="343.96" y2="248.21"/>
      <line x1="343.96" y1="239.26" x2="335.49" y2="232.20"/>
      <line x1="343.96" y1="239.26" x2="352.43" y2="232.20"/>
    </g>
  </g>

  <!-- 하단 명패: 다시 : 가능하게 (테두리 하단에 걸침) -->
  <text x="400" y="324" text-anchor="middle" class="ko-tag">다시 : 가능하게</text>
</svg>
