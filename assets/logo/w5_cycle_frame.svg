<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-labelledby="t d">
  <title id="t">RE:able — W5 Cycle Frame</title>
  <desc id="d">Olive 4.5px border + 우상단 코너 사이클 배지(↻ CW) + 콜론 잎맥 V. 워드마크 150px 정중앙.</desc>
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=block');
      .reable { font-family: 'Inter', 'Pretendard Variable', sans-serif; font-weight: 900; font-size: 150px; letter-spacing: -6px; fill: #4D5A3A; }
      .colon  { fill: #8FA66E; }
      .vein   { stroke: #3F5328; stroke-width: 1.1; opacity: 0.15; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <rect x="22" y="50" width="756" height="200" rx="8" ry="8" fill="#FFFFFF" stroke="#4D5A3A" stroke-width="4"/>

  <g transform="translate(778, 50)">
    <circle r="22" fill="#4D5A3A"/>
    <path d="M 3.746 -9.272 A 10 10 0 1 1 -3.746 -9.272" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <polygon points="-0.037 -10.770 -2.547 -6.305 -4.945 -12.239" fill="#FFFFFF"/>
  </g>

  <text x="400" y="204" text-anchor="middle" class="reable">RE<tspan class="colon">:</tspan>able</text>

  <g class="vein">
    <line x1="343.96" y1="128.87" x2="343.96" y2="152.07"/>
    <line x1="343.96" y1="143.12" x2="335.49" y2="136.06"/>
    <line x1="343.96" y1="143.12" x2="352.43" y2="136.06"/>

    <line x1="343.96" y1="179.01" x2="343.96" y2="202.21"/>
    <line x1="343.96" y1="193.26" x2="335.49" y2="186.20"/>
    <line x1="343.96" y1="193.26" x2="352.43" y2="186.20"/>
  </g>
</svg>
